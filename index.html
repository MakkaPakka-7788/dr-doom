 
<!doctype html>
<html lang="en">
<head><script id="flashcard-startup-gate">
(function(){
  function init(){
    var form=document.getElementById("flashcard-repo-lock-form");
    var overlay=document.getElementById("flashcard-repo-lock");
    if(!form||!overlay)return;
    var input=document.getElementById("flashcard-repo-lock-input");
    var error=document.getElementById("flashcard-repo-lock-error");
    form.addEventListener("submit",function(e){
      e.preventDefault();
      if(input.value!=="pness"){error.textContent="Incorrect password. Try again.";input.select();return;}
      form.querySelectorAll("input,button").forEach(function(el){el.disabled=true;});
      error.textContent="UNLOCKING...";
      var blocked=Array.from(document.querySelectorAll('script[type="application/x-flashcard-locked"]'));
      overlay.remove();
      (async function(){
        for(var old of blocked){
          var s=document.createElement("script");
          Array.from(old.attributes).forEach(function(a){
            if(a.name==="type"||a.name==="data-flashcard-type"||a.name==="data-flashcard-async"||a.name==="data-flashcard-defer")return;
            s.setAttribute(a.name,a.value);
          });
          var originalType=old.getAttribute("data-flashcard-type");
          if(originalType)s.type=originalType;
          if(old.hasAttribute("data-flashcard-async"))s.async=true;else s.async=false;
          if(old.hasAttribute("data-flashcard-defer"))s.defer=true;
          if(old.src){
            await new Promise(function(resolve){
              s.onload=resolve;s.onerror=resolve;
              (document.body||document.head).appendChild(s);
            });
          }else{
            s.textContent=old.textContent;
            (document.body||document.head).appendChild(s);
          }
          old.remove();
        }
      })();
    });
    input.focus();
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",init,{once:true});else init();
})();
</script>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>flashcard.com)</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #000; color: #cfcfcf;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-user-select: none; user-select: none; touch-action: none;
  }
  #wrap { display: flex; flex-direction: column; height: 100%; }
  #screen { flex: 1; position: relative; min-height: 0; background: #000; }
  canvas {
    display: block; width: 100%; height: 100%;
    object-fit: contain; image-rendering: pixelated; outline: none;
    background: #000;
  }

  #boot {
    position: absolute; inset: 0; z-index: 20;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #000; text-align: center; padding: 20px;
  }
  #boot.hidden { display: none; }
  #bootTitle { font-size: 26px; font-weight: 800; letter-spacing: 0.18em; color: #b81b1b; }
  #bootHint { margin-top: 8px; font-size: 12px; color: #7a7a7a; }
  #bootBtn {
    margin-top: 22px; border: 0; border-radius: 6px; padding: 14px 34px;
    background: #b81b1b; color: #fff; font-size: 16px; font-weight: 700; letter-spacing: 0.1em;
  }
  #bootBtn[disabled] { background: #3a2020; color: #8a8a8a; }

  #log {
    margin-top: 16px; width: 100%; max-width: 560px; height: 34vh; overflow: auto;
    background: #0b0b0b; border: 1px solid #222; border-radius: 6px; padding: 8px;
    font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10px; line-height: 1.45;
    color: #8fb98f; text-align: left; white-space: pre-wrap; word-break: break-word;
  }
  #log .e { color: #ff8f8f; }
  #log .i { color: #6ea8ff; }

  #pad { flex: 0 0 auto; padding: 8px 10px 14px; background: #0a0a0a; }
  #pad.hidden { display: none; }
  .row { display: flex; gap: 8px; justify-content: center; margin-top: 8px; }
  .btn {
    border: 0; border-radius: 10px; background: #1c1c1c; color: #d8d8d8;
    font-size: 15px; font-weight: 600; height: 50px; min-width: 52px;
    display: flex; align-items: center; justify-content: center; flex: 1;
  }
  .btn:active, .btn.on { background: #b81b1b; color: #fff; }
  .btn.wide { flex: 1.6; }
  .btn.small { font-size: 11px; letter-spacing: 0.05em; }
</style>


</body>
</html>
